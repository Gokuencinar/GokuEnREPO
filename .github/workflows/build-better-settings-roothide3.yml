name: Build Better Settings RootHide 3 (experimental)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-better-settings-roothide3.yml'
      - 'BetterSettings/**'
      - 'BetterPreferenceLoader/**'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare RootHide 3 build isolation
        shell: bash
        run: |
          set -euo pipefail
          cp -R BetterSettings "$RUNNER_TEMP/BetterSettingsRH"
          cp -R BetterPreferenceLoader "$RUNNER_TEMP/BetterPreferenceLoaderRH"
          python3 - <<'PY'
          import pathlib, os
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          a=root/'BetterSettingsRH'
          b=root/'BetterPreferenceLoaderRH'
          make=a/'Makefile'
          make.write_text(make.read_text().replace('export THEOS_PACKAGE_SCHEME := rootless','export THEOS_PACKAGE_SCHEME := roothide').replace('export ARCHS := arm64e','export ARCHS := arm64 arm64e'))
          ctrl=a/'control'
          ctrl.write_text(ctrl.read_text().replace('Architecture: iphoneos-arm64','Architecture: iphoneos-arm64e'))
          # Runtime paths must use the RootHide jbroot resolver rather than /var/jb.
          (b/'roothide.h').unlink()
          ctrl=b/'control'
          ctrl.write_text(ctrl.read_text().replace('Architecture: iphoneos-arm','Architecture: iphoneos-arm64e'))
          PY
      - name: Install RootHide Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'
      - name: Compile Better PreferenceLoader RootHide
        shell: bash
        run: make -C "$RUNNER_TEMP/BetterPreferenceLoaderRH" clean package SCHEME=roothide FINALPACKAGE=1
      - name: Compile Better Settings RootHide
        shell: bash
        run: make -C "$RUNNER_TEMP/BetterSettingsRH" clean package FINALPACKAGE=1
      - name: Verify RootHide Debian metadata and payload
        shell: bash
        run: |
          set -euo pipefail
          for project in BetterPreferenceLoaderRH BetterSettingsRH; do
            deb=$(find "$RUNNER_TEMP/$project/packages" -maxdepth 1 -name '*_iphoneos-arm64e.deb' -print -quit)
            test -n "$deb"
            mkdir -p "$RUNNER_TEMP/inspect-$project"
            cd "$RUNNER_TEMP/inspect-$project"
            ar -x "$deb"
            tar -xf "$(find . -name 'control.tar.*' -print -quit)"
            grep -Fx 'Architecture: iphoneos-arm64e' control
            tar -tf "$(find . -name 'data.tar.*' -print -quit)" | grep -E '(PreferenceLoader|BetterSettings)'
            if [ "$project" = BetterSettingsRH ]; then
              tar -tf "$(find . -name 'data.tar.*' -print -quit)" | grep -F 'BetterSettingsPrefs.bundle/CreditsAvatar.jpg'
              tar -tf "$(find . -name 'data.tar.*' -print -quit)" | grep -F 'BetterSettingsPrefs.bundle/icon.png'
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: BetterSettings-RootHide3-experimental
          path: |
            ${{ runner.temp }}/BetterPreferenceLoaderRH/packages/*_iphoneos-arm64e.deb
            ${{ runner.temp }}/BetterSettingsRH/packages/*_iphoneos-arm64e.deb
          if-no-files-found: error
