name: Update Nuke Wireless app resources

on:
  push:
    branches:
      - nuke-wireless-draft
    paths:
      - .github/workflows/update-nuke-wireless-payload.yml

permissions:
  contents: write

jobs:
  update-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install APT index tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev
      - name: Update app payload and APT index
        shell: bash
        run: |
          set -euo pipefail
          package="debs/com.gokuencinar.nukewireless_1.0.25+rh25_iphoneos-arm64e.deb"
          base="https://raw.githubusercontent.com/Gokuencinar/Harpy-RELOADED/nuke-wireless"
          work="$(mktemp -d)"
          dpkg-deb --raw-extract "$package" "$work/root"
          curl --fail --location "$base/prebuilt/NukeWirelessPaths_ios.dylib" \
            --output "$work/root/usr/lib/TweakInject/NukeWirelessPaths.dylib"
          curl --fail --location "$base/assets/CreditsAvatar.jpg" \
            --output "$work/root/Applications/HarpyReloaded.app/CreditsAvatar.jpg"
          dpkg-deb --build "$work/root" "$work/NukeWireless.deb"
          mv "$work/NukeWireless.deb" "$package"
          dpkg-scanpackages -m debs /dev/null > Packages
          gzip -9 -c Packages > Packages.gz
      - name: Commit updated package and index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debs/com.gokuencinar.nukewireless_1.0.25+rh25_iphoneos-arm64e.deb Packages Packages.gz
          git commit -m "Use profile avatar in Nuke Wireless package"
          git push
