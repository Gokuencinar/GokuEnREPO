name: Build CarrierFix 0.3 iOS 16

on:
  push:
    branches: [ carrierfix-0.1 ]
    paths:
      - 'build/CarrierFix-shared/**'
      - 'build/CarrierFix-0.1-RootHide/**'
      - 'build/CarrierFix-0.2-Dopamine/**'
      - 'CARRIERFIX.md'
      - '.github/workflows/build-carrierfix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-roothide-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Setup RootHide Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'
      - name: Validate RootHide source
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^Version: 0.3.0$' build/CarrierFix-0.1-RootHide/control
          grep -q '^Architecture: iphoneos-arm64e$' build/CarrierFix-0.1-RootHide/control
          grep -q '^ARCHS = arm64 arm64e$' build/CarrierFix-0.1-RootHide/Makefile
          grep -q '^TARGET = iphone:clang:16.5:16.0$' build/CarrierFix-0.1-RootHide/Makefile
          grep -q 'firmware (>= 16.0), firmware (<< 17.0)' build/CarrierFix-0.1-RootHide/control
          grep -q '<string>0.3.0</string>' build/CarrierFix-0.1-RootHide/app/Resources/Info.plist
          grep -q '<key>MinimumOSVersion</key><string>16.0</string>' build/CarrierFix-0.1-RootHide/app/Resources/Info.plist
          grep -q '/rootfs/var/mobile/Library/Carrier Bundles/Library/Preferences' build/CarrierFix-shared/CFCarrierManager.m
          grep -q 'com.apple.carrier_1.plist' build/CarrierFix-shared/CFCarrierManager.m
          grep -q 'directAPN' build/CarrierFix-shared/CFCarrierManager.m
          grep -q 'prepareVerifiedBackup' build/CarrierFix-shared/CFCarrierManager.m
          grep -q 'restore-test-' build/CarrierFix-shared/CFCarrierManager.m
          ! grep -R -q 'killall\|ldrestart\|sbreload' build/CarrierFix-0.1-RootHide build/CarrierFix-shared
          ! grep -R -q 'MobileSubstrate\|LaunchDaemons' build/CarrierFix-0.1-RootHide build/CarrierFix-shared
          plutil -lint build/CarrierFix-0.1-RootHide/app/Resources/Info.plist
          plutil -lint build/CarrierFix-0.1-RootHide/app/Entitlements.plist
      - name: Build RootHide validation package
        shell: bash
        run: |
          set -euo pipefail
          cd build/CarrierFix-0.1-RootHide
          chmod 755 layout/DEBIAN/postinst layout/DEBIAN/postrm
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          test -f packages/com.gokuencinar.carrierfix_0.3.0_iphoneos-arm64e.deb
          app=$(find .theos/_ -type f -name CarrierFix | head -n 1)
          lipo -archs "$app" | grep -q 'arm64 arm64e\|arm64e arm64'
          ldid -e "$app" > /tmp/carrierfix-rh-entitlements.plist
          grep -q 'platform-application' /tmp/carrierfix-rh-entitlements.plist
          grep -q 'com.apple.private.security.no-sandbox' /tmp/carrierfix-rh-entitlements.plist
      - uses: actions/upload-artifact@v4
        with:
          name: CarrierFix-RootHide-iOS16-0.3.0
          path: build/CarrierFix-0.1-RootHide/packages/com.gokuencinar.carrierfix_0.3.0_iphoneos-arm64e.deb

  build-dopamine:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'theos/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'
      - name: Validate Dopamine source
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^Version: 0.3.0$' build/CarrierFix-0.2-Dopamine/control
          grep -q '^Architecture: iphoneos-arm64$' build/CarrierFix-0.2-Dopamine/control
          grep -q '^ARCHS = arm64 arm64e$' build/CarrierFix-0.2-Dopamine/Makefile
          grep -q '^TARGET = iphone:clang:16.5:16.0$' build/CarrierFix-0.2-Dopamine/Makefile
          grep -q '^THEOS_PACKAGE_SCHEME = rootless$' build/CarrierFix-0.2-Dopamine/Makefile
          grep -q 'firmware (>= 16.0), firmware (<< 17.0)' build/CarrierFix-0.2-Dopamine/control
          grep -q '<string>0.3.0</string>' build/CarrierFix-0.2-Dopamine/app/Resources/Info.plist
          grep -q '<key>MinimumOSVersion</key><string>16.0</string>' build/CarrierFix-0.2-Dopamine/app/Resources/Info.plist
          grep -q '/private/var/mobile/Library/Carrier Bundles/Library/Preferences' build/CarrierFix-shared/CFCarrierManager.m
          grep -q 'com.apple.carrier_1.plist' build/CarrierFix-shared/CFCarrierManager.m
          grep -q 'directAPN' build/CarrierFix-shared/CFCarrierManager.m
          ! grep -R -q 'roothide.h\|libroothide\|jbroot(' build/CarrierFix-0.2-Dopamine build/CarrierFix-shared
          ! grep -R -q 'killall\|ldrestart\|sbreload' build/CarrierFix-0.2-Dopamine build/CarrierFix-shared
          plutil -lint build/CarrierFix-0.2-Dopamine/app/Resources/Info.plist
          plutil -lint build/CarrierFix-0.2-Dopamine/app/Entitlements.plist
      - name: Build Dopamine iOS 16 package
        shell: bash
        run: |
          set -euo pipefail
          cd build/CarrierFix-0.2-Dopamine
          chmod 755 layout/DEBIAN/postinst layout/DEBIAN/postrm
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          test -f packages/com.gokuencinar.carrierfix.dopamine_0.3.0_iphoneos-arm64.deb
          app=$(find .theos/_ -type f -name CarrierFix | head -n 1)
          lipo -archs "$app" | grep -q 'arm64 arm64e\|arm64e arm64'
          ldid -e "$app" > /tmp/carrierfix-dop-entitlements.plist
          grep -q 'platform-application' /tmp/carrierfix-dop-entitlements.plist
          grep -q 'com.apple.private.security.no-sandbox' /tmp/carrierfix-dop-entitlements.plist
      - uses: actions/upload-artifact@v4
        with:
          name: CarrierFix-Dopamine-iOS16-0.3.0
          path: build/CarrierFix-0.2-Dopamine/packages/com.gokuencinar.carrierfix.dopamine_0.3.0_iphoneos-arm64.deb

  inspect-packages:
    needs: [build-roothide-test, build-dopamine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CarrierFix-RootHide-iOS16-0.3.0
          path: /tmp/root
      - uses: actions/download-artifact@v4
        with:
          name: CarrierFix-Dopamine-iOS16-0.3.0
          path: /tmp/dop
      - name: Inspect packages
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/root/com.gokuencinar.carrierfix_0.3.0_iphoneos-arm64e.deb
          dop=/tmp/dop/com.gokuencinar.carrierfix.dopamine_0.3.0_iphoneos-arm64.deb
          test "$(dpkg-deb -f "$root" Version)" = '0.3.0'
          test "$(dpkg-deb -f "$root" Architecture)" = 'iphoneos-arm64e'
          test "$(dpkg-deb -f "$dop" Version)" = '0.3.0'
          test "$(dpkg-deb -f "$dop" Architecture)" = 'iphoneos-arm64'
          for deb in "$root" "$dop"; do
            dpkg-deb -c "$deb" > /tmp/contents.txt
            grep -q 'CarrierFix.app/CarrierFix' /tmp/contents.txt
            ! grep -q 'MobileSubstrate/DynamicLibraries' /tmp/contents.txt
            ! grep -q 'LaunchDaemons' /tmp/contents.txt
          done