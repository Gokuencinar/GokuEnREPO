name: Build BandLock 0.3.6

on:
  push:
    branches: [ main ]
    paths:
      - 'build/BandLock-0.3.6/**'
      - '.github/workflows/build-bandlock-036.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup RootHide Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint build/BandLock-0.3.6/prefs/Resources/Info.plist
          plutil -lint build/BandLock-0.3.6/prefs/Resources/Root.plist
          grep -q 'BandLock-last.txt' build/BandLock-0.3.6/prefs/BLRootListController.m
          grep -q 'clearLogs' build/BandLock-0.3.6/prefs/BLRootListController.m
          grep -q 'getBandInfo:error:' build/BandLock-0.3.6/prefs/BLRootListController.m
          ! grep -q 'setBandInfo:' build/BandLock-0.3.6/prefs/BLRootListController.m
          ! grep -q 'setActiveBandInfo:' build/BandLock-0.3.6/prefs/BLRootListController.m

      - name: Build RootHide package
        shell: bash
        run: |
          set -euo pipefail
          cd build/BandLock-0.3.6
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          ls -lh packages/*.deb
          test -f packages/com.local.bandlock_0.3.6_iphoneos-arm64e.deb
          cp packages/com.local.bandlock_0.3.6_iphoneos-arm64e.deb ../../debs/

      - name: Publish package to repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debs/com.local.bandlock_0.3.6_iphoneos-arm64e.deb
          if ! git diff --cached --quiet; then
            git commit -m "Publish BandLock 0.3.6"
            git push
          fi

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: BandLock-0.3.6-deb
          path: build/BandLock-0.3.6/packages/*.deb
          if-no-files-found: error

  reindex:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install dpkg tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Rebuild APT index
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only
          dpkg-scanpackages -m debs /dev/null > Packages
          gzip -9 -c Packages > Packages.gz

      - name: Publish APT index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild APT index for BandLock 0.3.6"
            git push
          fi
