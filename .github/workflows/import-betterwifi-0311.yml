name: Import BetterWiFi RH 0.3.11

on:
  push:
    paths:
      - '.github/workflows/import-betterwifi-0311.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify package
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_URL='https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-efc4-820a-9994-3b695f0fb7d7/raw?se=2026-09-28T12%3A02%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=70bac653-c653-5737-b1f5-a1ac41de5d7c&skoid=a63e6f05-dc2f-4fa5-b0e3-b1cb9c0893bb&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T08%3A02%3A09Z&ske=2026-09-29T08%3A02%3A09Z&sks=b&skv=2026-02-06&sig=2lleRbDZ/9DUt4KoyZNqzEbMMn1dkKqJYRG5OOI%2BEM4%3D'
          curl -fL "$ARTIFACT_URL" -o /tmp/bwrh0311.zip
          unzip -q /tmp/bwrh0311.zip -d /tmp/bwrh0311
          deb="$(find /tmp/bwrh0311 -name '*.deb' -type f | head -1)"
          test -n "$deb"
          test "$(sha256sum "$deb" | awk '{print $1}')" = "3fef1fa435d4ba3e563f2ad91d9fff5af99b1ae71daa2b2d05ee35db14a96b7f"
          test "$(dpkg-deb -f "$deb" Package)" = "com.betterwifirh.tweak"
          test "$(dpkg-deb -f "$deb" Version)" = "0.3.11"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64e"
          rm -rf /tmp/bwrh0311-check
          mkdir -p /tmp/bwrh0311-check
          dpkg-deb -x "$deb" /tmp/bwrh0311-check
          test -f /tmp/bwrh0311-check/Library/PreferenceBundles/BetterWiFiRHPrefs.bundle/CreditsAvatar.jpg
          cp "$deb" /tmp/com.betterwifirh.tweak_0.3.11_iphoneos-arm64e.deb

      - name: Publish package and rebuild APT index
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y dpkg-dev >/dev/null

          rm -f debs/com.betterwifirh.tweak_*_iphoneos-arm64e.deb
          cp /tmp/com.betterwifirh.tweak_0.3.11_iphoneos-arm64e.deb debs/

          dpkg-scanpackages -m debs /dev/null > Packages
          gzip -9 -c Packages > Packages.gz

          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('README.md')
          if p.exists():
              t=p.read_text()
              for old in ('0.3.8','0.3.9','0.3.10'):
                  t=t.replace(f'| BetterWiFi RH | {old} | `iphoneos-arm64e` |','| BetterWiFi RH | 0.3.11 | `iphoneos-arm64e` |')
              p.write_text(t)

          p=Path('BETTERWIFI-RH.md')
          if p.exists():
              t=p.read_text()
              t=re.sub(r'Current version / Versión actual: \*\*0\.3\.(?:8|9|10)\*\*','Current version / Versión actual: **0.3.11**',t)
              p.write_text(t)

          p=Path('changelogs/BetterWiFi-RH.md')
          if p.exists():
              t=p.read_text()
              if '## 0.3.11' not in t:
                  marker='## 0.3.10' if '## 0.3.10' in t else '## 0.3.9'
                  entry='''## 0.3.11\n\n### Nuevo\n- Sección de créditos integrada al final de las preferencias.\n- Avatar de Gokuencinar / GokuEn, el mismo utilizado en otros tweaks.\n- Botón para abrir GokuEnREPO.\n- Botón **Buy Me a Coffee** enlazado a https://buymeacoffee.com/gokuen.\n- Los textos de créditos respetan el selector Español / Inglés / Automático.\n\n### Conservado\n- Selector de idioma inline de 0.3.10.\n- Todas las correcciones de filtros, monitor, analizador, estabilidad y consumo.\n\n'''
                  t=t.replace(marker,entry+marker)
              p.write_text(t)

          p=Path('betterwifi-rh.html')
          if p.exists():
              t=p.read_text().replace('0.3.10','0.3.11').replace('0.3.9','0.3.11')
              p.write_text(t)
          PY

          grep -q '^Package: com.betterwifirh.tweak$' Packages
          grep -q '^Version: 0.3.11$' Packages
          grep -q '^Architecture: iphoneos-arm64e$' Packages
          grep -q '^SHA256: 3fef1fa435d4ba3e563f2ad91d9fff5af99b1ae71daa2b2d05ee35db14a96b7f$' Packages

      - name: Commit repository update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update BetterWiFi RH to 0.3.11"
          git push
