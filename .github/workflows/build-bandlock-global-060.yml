name: Build BandLock Global 0.6.0

on:
  push:
    branches: [ main ]
    paths:
      - 'build/BandLock-0.6.0/**'
      - '.github/workflows/build-bandlock-global-060.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup RootHide Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint build/BandLock-0.6.0/app/Resources/Info.plist
          plutil -lint build/BandLock-0.6.0/app/Entitlements.plist
          python3 -m json.tool build/BandLock-0.6.0/app/Resources/countries.json >/dev/null
          python3 - <<'PY'
          import json
          p='build/BandLock-0.6.0/app/Resources/countries.json'
          data=json.load(open(p, encoding='utf-8-sig'))
          assert len(data.get('countries', [])) >= 150
          assert any(c.get('name') == 'Spain' and 20 in c.get('bands', []) for c in data['countries'])
          PY
          grep -q 'SUBPROJECTS += app' build/BandLock-0.6.0/Makefile
          grep -q 'APPLICATION_NAME = BandLock' build/BandLock-0.6.0/app/Makefile
          grep -q 'applyPendingBandsWithCompletion:' build/BandLock-0.6.0/app/BLTelephonyManager.m
          grep -q 'sleepForTimeInterval:0.8' build/BandLock-0.6.0/app/BLTelephonyManager.m
          grep -q 'sleepForTimeInterval:1.0' build/BandLock-0.6.0/app/BLTelephonyManager.m
          grep -q 'Preparar bandas compatibles' build/BandLock-0.6.0/app/BLCountryDetailViewController.m
          grep -q 'com.gokuencinar.bandlock' build/BandLock-0.6.0/control
          test ! -d build/BandLock-0.6.0/prefs
          grep -q 'uicache -a' build/BandLock-0.6.0/layout/DEBIAN/postinst
          ! grep -R -E 'BLSpainBands|supportedSpain|activeSpain|selectOrangeSpain' build/BandLock-0.6.0

      - name: Build RootHide package
        shell: bash
        run: |
          set -euo pipefail
          cd build/BandLock-0.6.0
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          ls -lh packages/*.deb
          test -f packages/com.gokuencinar.bandlock_0.6.0_iphoneos-arm64e.deb
          cp packages/com.gokuencinar.bandlock_0.6.0_iphoneos-arm64e.deb ../../debs/

      - name: Publish package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debs/com.gokuencinar.bandlock_0.6.0_iphoneos-arm64e.deb
          if ! git diff --cached --quiet; then
            git commit -m "Publish BandLock Global 0.6.0"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BandLock-0.6.0-deb
          path: build/BandLock-0.6.0/packages/*.deb
          if-no-files-found: error

  reindex:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install dpkg tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Rebuild APT index
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only
          dpkg-scanpackages -m debs /dev/null > Packages
          gzip -9 -c Packages > Packages.gz

      - name: Publish APT index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild APT index for BandLock Global 0.6.0"
            git push
          fi

