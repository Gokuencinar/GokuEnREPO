name: Build BandLock 1.6 IPC hardening

on:
  push:
    branches: [bandlock-1.5-roothide-signal-test]
    paths:
      - 'tweaks/BandLock/build/BandLock-1.0-RootHide/**'
      - 'tweaks/BandLock/build/BandLock-1.0-Dopamine/**'
      - 'tweaks/BandLock/build/BandLock-1.0-Rootful/**'
      - 'tweaks/BandLock/build/BLHardwareCapabilities.h'
      - 'scripts/verify-bandlock-roothide-signal.mjs'
      - '.github/workflows/build-bandlock-roothide-signal-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-roothide:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Setup RootHide Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'
      - name: RootHide static and privacy gates
        run: |
          set -euo pipefail
          node scripts/verify-bandlock-roothide-signal.mjs
          d=tweaks/BandLock/build/BandLock-1.0-RootHide
          plutil -lint "$d/app/Resources/Info.plist"
          plutil -lint "$d/daemon/Entitlements.plist"
          plutil -lint "$d/layout/Library/LaunchDaemons/com.gokuencinar.bandlockd.plist"
          sh -n "$d/layout/DEBIAN/postinst"
          grep -q '^Version: 1.6.0~rhui28$' "$d/control"
          grep -q '<key>CFBundleShortVersionString</key><string>1.6.0</string>' "$d/app/Resources/Info.plist"
          test -x "$d/layout/DEBIAN/prerm"
          ! grep -q '<key>Sockets</key>' "$d/layout/Library/LaunchDaemons/com.gokuencinar.bandlockd.plist"
      - name: Build RootHide LTE scan experiment
        run: |
          set -euo pipefail
          cd tweaks/BandLock/build/BandLock-1.0-RootHide
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          deb='packages/com.gokuencinar.bandlock_1.6.0~rhui28_iphoneos-arm64e.deb'
          test -s "$deb"
          test -f "$(find .theos/_ -type f -name BandLockDaemon | head -n 1)"
          file "$(find .theos/_ -type f -name BandLockDaemon | head -n 1)" | grep -q Mach-O
          grep -q 'BLRHSignalScan.m' daemon/Makefile
          cc="$(find .theos/_ -type f -name BandLockCCModule | head -n 1)"
          bridge="$(find .theos/_ -type f -name BandLockFieldBridge.dylib | head -n 1)"
          test -n "$cc" && test -n "$bridge"
          python3 ../../../../scripts/verify-bandlock-arm64e-abi-v2.py "$cc" "$bridge"
      - uses: actions/upload-artifact@v4
        with:
          name: BandLock-RootHide-1.6.0-rhui28
          path: tweaks/BandLock/build/BandLock-1.0-RootHide/packages/com.gokuencinar.bandlock_1.6.0~rhui28_iphoneos-arm64e.deb

  verify-deb:
    needs: build-roothide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BandLock-RootHide-1.6.0-rhui28
          path: /tmp/bandlock
      - name: Check RootHide DEB metadata
        run: |
          set -euo pipefail
          deb='/tmp/bandlock/com.gokuencinar.bandlock_1.6.0~rhui28_iphoneos-arm64e.deb'
          test -s "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = 'com.gokuencinar.bandlock'
          test "$(dpkg-deb -f "$deb" Version)" = '1.6.0~rhui28'
          test "$(dpkg-deb -f "$deb" Architecture)" = 'iphoneos-arm64e'
          dpkg-deb -c "$deb" > /tmp/bandlock-contents
          grep -q 'BandLockDaemon' /tmp/bandlock-contents
          grep -q 'BandLock.app/BandLock' /tmp/bandlock-contents
          grep -q 'BandLockCCModule' /tmp/bandlock-contents
          dpkg-deb --ctrl-tarfile "$deb" | tar -tvf - | grep -q './prerm'
          rm -rf /tmp/bandlock-extracted
          dpkg-deb -x "$deb" /tmp/bandlock-extracted
          python3 scripts/verify-bandlock-arm64e-abi-v2.py \
            /tmp/bandlock-extracted/Library/ControlCenter/Bundles/BandLockCCModule.bundle/BandLockCCModule \
            /tmp/bandlock-extracted/Library/MobileSubstrate/DynamicLibraries/BandLockFieldBridge.dylib
          sha256sum "$deb"

  build-dopamine:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'theos/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'
      - name: Dopamine IPC static gates
        run: |
          set -euo pipefail
          d=tweaks/BandLock/build/BandLock-1.0-Dopamine
          r=tweaks/BandLock/build/BandLock-1.0-RootHide
          plutil -lint "$d/app/Resources/Info.plist"
          plutil -lint "$d/daemon/Entitlements.plist"
          plutil -lint "$d/layout/Library/LaunchDaemons/com.gokuencinar.bandlockd.dopamine.plist"
          sh -n "$d/layout/DEBIAN/postinst"
          grep -q '^Version: 1.6.0~dopipc7$' "$d/control"
          grep -q '^Architecture: iphoneos-arm64$' "$d/control"
          grep -q 'BLAnalyzerViewController.m' "$d/app/Makefile"
          grep -q 'BLAnalyzerCaptureStore.m' "$d/app/Makefile"
          grep -q 'BLAnalyzerCapturesViewController.m' "$d/app/Makefile"
          grep -q 'QuartzCore' "$d/app/Makefile"
          test -s "$d/app/Resources/country-spectrum.json"
          test -s "$d/daemon/BLRHSignalScan.m"
          test ! -e "$d/daemon/BLSignalScan.m"
          grep -q 'BLRHSignalScan.m' "$d/daemon/Makefile"
          grep -q 'queryCoreTelephonyForPassiveObservation' "$d/daemon/BLTelephonyCore.m"
          grep -q 'startTechnologyScanWithManager:' "$d/daemon/BLRHSignalScan.m"
          ! grep -R -n -E '#import <roothide\.h>|jbroot\(' "$d/app" "$d/daemon"
          ! grep -q -- '-lroothide' "$d/app/Makefile"
          for f in \
            BLAppDelegate.h BLAppDelegate.m \
            BLBandPickerViewController.h BLBandPickerViewController.m \
            BLControlViewController.h \
            BLCountriesViewController.h BLCountriesViewController.m \
            BLCountryBandsViewController.h BLCountryBandsViewController.m \
            BLCountryDetailViewController.h BLCountryDetailViewController.m \
            BLCountryProfile.h BLCountryProfile.m \
            BLFrequencyGlossaryViewController.h BLFrequencyGlossaryViewController.m \
            BLLanguageViewController.h BLLanguageViewController.m \
            BLLocalization.h BLLocalization.m \
            BLNRBandPickerViewController.h BLNRBandPickerViewController.m \
            BLAnalyzerViewController.h BLAnalyzerViewController.m \
            BLAnalyzerCaptureStore.h BLAnalyzerCaptureStore.m \
            BLAnalyzerCapturesViewController.h BLAnalyzerCapturesViewController.m; do
            cmp "$d/app/$f" "$r/app/$f"
          done
          cmp "$d/app/Resources/country-spectrum.json" "$r/app/Resources/country-spectrum.json"
          cmp "$d/app/Resources/countries.json" "$r/app/Resources/countries.json"
          test -s "$d/daemon/BLTelephonyCore.m"
          cmp "$d/daemon/BLTelephonyManager.h" "$r/daemon/BLTelephonyManager.h"
          cmp "$d/shared/BLCCPreferences.m" "$r/shared/BLCCPreferences.m"
          cmp "$d/shared/BLGBandMetadata.m" "$r/shared/BLGBandMetadata.m"
          grep -q '<key>BandLockListener</key>' "$d/layout/Library/LaunchDaemons/com.gokuencinar.bandlockd.dopamine.plist"
          grep -q '<key>SockPathOwner</key>' "$d/layout/Library/LaunchDaemons/com.gokuencinar.bandlockd.dopamine.plist"
          grep -q '<integer>501</integer>' "$d/layout/Library/LaunchDaemons/com.gokuencinar.bandlockd.dopamine.plist"
          grep -q '<integer>384</integer>' "$d/layout/Library/LaunchDaemons/com.gokuencinar.bandlockd.dopamine.plist"
          grep -q 'launch_activate_socket' "$d/daemon/main.m"
          grep -q 'launch socket listen ready' "$d/daemon/main.m"
          ! grep -q 'getsockopt(serverFD, SOL_SOCKET, SO_ACCEPTCONN' "$d/daemon/main.m"
          grep -q 'BLLegacyServerSocket' "$d/daemon/main.m"
          grep -q 'wait_for_socket' "$d/layout/DEBIAN/postinst"
          grep -q 'retrying system domain' "$d/layout/DEBIAN/postinst"
      - name: Build Dopamine IPC candidate
        run: |
          set -euo pipefail
          cd tweaks/BandLock/build/BandLock-1.0-Dopamine
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          deb='packages/com.gokuencinar.bandlock.dopamine_1.6.0~dopipc7_iphoneos-arm64.deb'
          test -s "$deb"
          daemon="$(find .theos/_ -type f -name BandLockDaemon | head -n 1)"
          test -n "$daemon"
          file "$daemon" | grep -q Mach-O
          command -v ldid >/dev/null 2>&1
          ! otool -L "$daemon" | grep -q 'libroothide.dylib'
          ldid -e "$daemon" > /tmp/bandlock-dopamine-entitlements.plist
          grep -q 'com.apple.private.memorystatus' /tmp/bandlock-dopamine-entitlements.plist
          grep -q 'com.apple.CommCenter.fine-grained' /tmp/bandlock-dopamine-entitlements.plist
      - uses: actions/upload-artifact@v4
        with:
          name: BandLock-Dopamine-1.6.0-dopipc7
          path: tweaks/BandLock/build/BandLock-1.0-Dopamine/packages/com.gokuencinar.bandlock.dopamine_1.6.0~dopipc7_iphoneos-arm64.deb

  verify-dopamine-deb:
    needs: build-dopamine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BandLock-Dopamine-1.6.0-dopipc7
          path: /tmp/bandlock-dopamine
      - name: Check Dopamine DEB metadata and launchd socket
        run: |
          set -euo pipefail
          deb='/tmp/bandlock-dopamine/com.gokuencinar.bandlock.dopamine_1.6.0~dopipc7_iphoneos-arm64.deb'
          test -s "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = 'com.gokuencinar.bandlock.dopamine'
          test "$(dpkg-deb -f "$deb" Version)" = '1.6.0~dopipc7'
          test "$(dpkg-deb -f "$deb" Architecture)" = 'iphoneos-arm64'
          rm -rf /tmp/bandlock-dopamine-extracted
          dpkg-deb -x "$deb" /tmp/bandlock-dopamine-extracted
          plist='/tmp/bandlock-dopamine-extracted/var/jb/Library/LaunchDaemons/com.gokuencinar.bandlockd.dopamine.plist'
          grep -q 'BandLockListener' "$plist"
          grep -q '/tmp/com.gokuencinar.bandlockd.dopamine.sock' "$plist"
          test -n "$(find /tmp/bandlock-dopamine-extracted -type f -name country-spectrum.json -print -quit)"
          test -n "$(find /tmp/bandlock-dopamine-extracted -type f -name BandLockDaemon -print -quit)"
          sha256sum "$deb"

  build-rootful:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'theos/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'
      - name: Rootful shared-UI gates
        run: |
          set -euo pipefail
          d=tweaks/BandLock/build/BandLock-1.0-Rootful
          shared=tweaks/BandLock/build/BandLock-1.0-Dopamine
          grep -q '^Package: com.gokuencinar.bandlock.rootful$' "$d/control"
          grep -q '^Version: 1.6.0~rootui1$' "$d/control"
          grep -q '^Architecture: iphoneos-arm$' "$d/control"
          grep -q '^TARGET = iphone:clang:16.5:15.0$' "$d/Makefile"
          grep -q 'BL_VARIANT_ROOTFUL=1' "$d/Makefile"
          ! grep -q 'THEOS_PACKAGE_SCHEME' "$d/Makefile"
          ! grep -q 'Cambio de modo sujeto a verificación\|Mode change requires verification' "$shared/app/BLControlViewController.m"
          grep -q 'compatibilityLegendView' "$shared/app/BLCountriesViewController.m"
          grep -q 'xmark.circle.fill' "$shared/app/BLCountryDetailViewController.m"
          grep -q 'systemRedColor' "$shared/app/BLCountryDetailViewController.m"
          grep -q 'com.gokuencinar.bandlockd.rootful.sock' "$shared/app/BLTelephonyManager.m"
          grep -q 'com.gokuencinar.bandlockd.rootful.sock' "$shared/daemon/main.m"
      - name: Build Rootful UI candidate
        run: |
          set -euo pipefail
          cd tweaks/BandLock/build/BandLock-1.0-Rootful
          chmod 755 layout/DEBIAN/postinst layout/DEBIAN/postrm
          make clean package FINALPACKAGE=1
          deb='packages/com.gokuencinar.bandlock.rootful_1.6.0~rootui1_iphoneos-arm.deb'
          test -s "$deb"
          app="$(find .theos/_ -type f -path '*/Applications/BandLock.app/BandLock' | head -n 1)"
          daemon="$(find .theos/_ -type f -name BandLockDaemon | head -n 1)"
          test -n "$app" && test -n "$daemon"
          file "$app" | grep -q Mach-O
          file "$daemon" | grep -q Mach-O
          ! otool -L "$daemon" | grep -q 'libroothide.dylib'
      - uses: actions/upload-artifact@v4
        with:
          name: BandLock-Rootful-1.6.0-rootui1
          path: tweaks/BandLock/build/BandLock-1.0-Rootful/packages/com.gokuencinar.bandlock.rootful_1.6.0~rootui1_iphoneos-arm.deb

  verify-rootful-deb:
    needs: build-rootful
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BandLock-Rootful-1.6.0-rootui1
          path: /tmp/bandlock-rootful
      - name: Check Rootful DEB metadata and classic paths
        run: |
          set -euo pipefail
          deb='/tmp/bandlock-rootful/com.gokuencinar.bandlock.rootful_1.6.0~rootui1_iphoneos-arm.deb'
          test -s "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = 'com.gokuencinar.bandlock.rootful'
          test "$(dpkg-deb -f "$deb" Version)" = '1.6.0~rootui1'
          test "$(dpkg-deb -f "$deb" Architecture)" = 'iphoneos-arm'
          rm -rf /tmp/bandlock-rootful-extracted
          dpkg-deb -x "$deb" /tmp/bandlock-rootful-extracted
          test -x /tmp/bandlock-rootful-extracted/Applications/BandLock.app/BandLock
          test -x /tmp/bandlock-rootful-extracted/usr/libexec/BandLockDaemon
          test -f /tmp/bandlock-rootful-extracted/Library/LaunchDaemons/com.gokuencinar.bandlockd.rootful.plist
          grep -a -q 'com.gokuencinar.bandlockd.rootful.sock' /tmp/bandlock-rootful-extracted/usr/libexec/BandLockDaemon
          ! grep -R -a -q '/var/jb' /tmp/bandlock-rootful-extracted
          ! grep -R -a -q 'libroothide\|\.jbroot-' /tmp/bandlock-rootful-extracted
          sha256sum "$deb"
