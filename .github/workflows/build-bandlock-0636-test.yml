name: Build BandLock 0.6.36 Test

on:
  push:
    branches: [ bandlock-0.6.36-5g ]
    paths:
      - 'build/BandLock-0.6.36-RootHide/**'
      - 'build/BandLock-0.6.36-Dopamine/**'
      - '.github/workflows/build-bandlock-0636-test.yml'

permissions:
  contents: read

jobs:
  build-roothide:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Setup RootHide Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'
      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint build/BandLock-0.6.36-RootHide/app/Resources/Info.plist
          grep -q '^Version: 0.6.36$' build/BandLock-0.6.36-RootHide/control
          python3 -m json.tool build/BandLock-0.6.36-RootHide/app/Resources/countries.json >/dev/null
          grep -q '5G Auto / 5G On / 5G Only' build/BandLock-0.6.36-RootHide/app/BLControlViewController.m
      - name: Build RootHide test package
        run: |
          cd build/BandLock-0.6.36-RootHide
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          test -f packages/com.gokuencinar.bandlock_0.6.36_iphoneos-arm64e.deb
      - uses: actions/upload-artifact@v4
        with:
          name: BandLock-0.6.36-RootHide-test
          path: build/BandLock-0.6.36-RootHide/packages/com.gokuencinar.bandlock_0.6.36_iphoneos-arm64e.deb

  build-dopamine:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'theos/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'
      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint build/BandLock-0.6.36-Dopamine/app/Resources/Info.plist
          grep -q '^Version: 0.6.36$' build/BandLock-0.6.36-Dopamine/control
          grep -q '^Architecture: iphoneos-arm64$' build/BandLock-0.6.36-Dopamine/control
          python3 -m json.tool build/BandLock-0.6.36-Dopamine/app/Resources/countries.json >/dev/null
          grep -q '5G Auto / 5G On / 5G Only' build/BandLock-0.6.36-Dopamine/app/BLControlViewController.m
          ! grep -R --include='*.m' --include='*.h' --include='Makefile' -q 'jbroot\|roothide.h\|libroothide\|/.jbroot-' build/BandLock-0.6.36-Dopamine
      - name: Build Dopamine test package
        run: |
          cd build/BandLock-0.6.36-Dopamine
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          test -f packages/com.gokuencinar.bandlock.dopamine_0.6.36_iphoneos-arm64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: BandLock-0.6.36-Dopamine-test
          path: build/BandLock-0.6.36-Dopamine/packages/com.gokuencinar.bandlock.dopamine_0.6.36_iphoneos-arm64.deb
