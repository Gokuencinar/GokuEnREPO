name: Publish Nuke Wireless 1.0.26

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-nuke-wireless-1026.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Rebuild Nuke Wireless package
        shell: bash
        run: |
          set -euo pipefail
          old="debs/com.gokuencinar.nukewireless_1.0.25+rh25_iphoneos-arm64e.deb"
          new="debs/com.gokuencinar.nukewireless_1.0.26+rh26_iphoneos-arm64e.deb"
          dylib_url="https://raw.githubusercontent.com/Gokuencinar/Harpy-RELOADED/1c1c527cdb11a1426824fe00271481f259d72b92/prebuilt/NukeWirelessPaths_ios.dylib"
          work="$(mktemp -d)"

          dpkg-deb --raw-extract "$old" "$work/root"
          curl --fail --location "$dylib_url" --output "$work/NukeWirelessPaths_ios.dylib"
          install -m 0755 "$work/NukeWirelessPaths_ios.dylib" +            "$work/root/usr/lib/TweakInject/NukeWirelessPaths.dylib"

          sed -i 's/^Version: .*/Version: 1.0.26+rh26/' "$work/root/DEBIAN/control"

          ROOT_DIR="$work/root" python3 - <<'PY'
          import os
          from pathlib import Path
          import plistlib

          path = Path(os.environ["ROOT_DIR"]) / "Applications/HarpyReloaded.app/Info.plist"
          data = plistlib.loads(path.read_bytes())
          data["CFBundleShortVersionString"] = "1.0.26"
          data["CFBundleVersion"] = "26"
          data["CFBundleDisplayName"] = "Nuke Wireless"
          data["CFBundleName"] = "Nuke Wireless"
          path.write_bytes(plistlib.dumps(data, fmt=plistlib.FMT_BINARY))
          PY

          dpkg-deb --build "$work/root" "$new"
          dpkg-deb -f "$new" Package Version Architecture Name

          dpkg-scanpackages -m debs /dev/null > Packages
          gzip -9 -c Packages > Packages.gz

          sed -i 's/Nuke Wireless 1\.0\.25/Nuke Wireless 1.0.26/' README.md

      - name: Commit package and repository index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add +            debs/com.gokuencinar.nukewireless_1.0.26+rh26_iphoneos-arm64e.deb +            Packages Packages.gz README.md
          git commit -m "Publish Nuke Wireless 1.0.26"
          git push
