name: Build BandLock 0.3.8

on:
  push:
    branches: [ main ]
    paths:
      - 'build/BandLock-0.3.8/**'
      - '.github/workflows/build-bandlock-038.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Setup RootHide Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint build/BandLock-0.3.8/prefs/Resources/Info.plist
          grep -q 'B3 · 1800 MHz' build/BandLock-0.3.8/prefs/BLRootListController.m || grep -q '@3: @"1800 MHz"' build/BandLock-0.3.8/prefs/BLRootListController.m
          grep -q 'Preset Orange España' build/BandLock-0.3.8/prefs/BLRootListController.m
          grep -q 'com.apple.fieldtest' build/BandLock-0.3.8/prefs/BLRootListController.m
          grep -q 'setActiveBandInfo:bands:error:' build/BandLock-0.3.8/prefs/BLRootListController.m
      - name: Build RootHide package
        shell: bash
        run: |
          set -euo pipefail
          cd build/BandLock-0.3.8
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          ls -lh packages/*.deb
          test -f packages/com.local.bandlock_0.3.8_iphoneos-arm64e.deb
          cp packages/com.local.bandlock_0.3.8_iphoneos-arm64e.deb ../../debs/
      - name: Publish package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debs/com.local.bandlock_0.3.8_iphoneos-arm64e.deb
          if ! git diff --cached --quiet; then
            git commit -m "Publish BandLock 0.3.8"
            git push
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BandLock-0.3.8-deb
          path: build/BandLock-0.3.8/packages/*.deb
          if-no-files-found: error

  reindex:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install dpkg tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev
      - name: Rebuild APT index
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only
          dpkg-scanpackages -m debs /dev/null > Packages
          gzip -9 -c Packages > Packages.gz
      - name: Publish APT index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild APT index for BandLock 0.3.8"
            git push
          fi
