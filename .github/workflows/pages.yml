name: Website

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "tweaks/**/depiction.html"
      - "tweaks/**/depiction.json"
      - "tweaks/**/assets/**"
      - "tweaks/**/README.md"
      - "tweaks/**/CHANGELOG.md"
      - "sitemap.xml"
      - "robots.txt"
      - "add/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble website without Debian packages or build artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages-site
          cp index.html sitemap.xml robots.txt pages-site/
          cp -R add assets pages-site/
          while IFS= read -r -d '' asset; do
            mkdir -p "pages-site/$(dirname "$asset")"
            cp "$asset" "pages-site/$asset"
          done < <(find tweaks -type f \( \
              -name 'depiction.html' -o -name 'depiction.json' -o \
              -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o \
              -name '*.webp' -o -name '*.svg' -o -name '*.gif' -o \
              -name '*.css' -o -name '*.js' -o -name '*.woff' -o -name '*.woff2' \
            \) -print0)
          touch pages-site/.nojekyll
          du -sh pages-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site
      - name: Allow the uploaded Pages artifact to become available
        shell: bash
        run: sleep 15
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
