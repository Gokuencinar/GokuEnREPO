name: Publish BetterWiFi RH 0.3.10

on:
  push:
    paths:
      - '.github/workflows/import-betterwifi-0310.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish package
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-9ef4-81f4-a25a-c38213fbbd42/raw?se=2026-09-28T11%3A35%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=fed73bee-9015-5c7a-82e3-eb76bd36bcfb&skoid=a63e6f05-dc2f-4fa5-b0e3-b1cb9c0893bb&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T09%3A24%3A56Z&ske=2026-09-29T09%3A24%3A56Z&sks=b&skv=2026-02-06&sig=3Ql/382DyavPg4rFApUwqvh4TjhoWLbWWSUObSJAo2U%3D' -o /tmp/artifact.zip
          unzip -q /tmp/artifact.zip -d /tmp/artifact
          deb="$(find /tmp/artifact -name '*.deb' -type f | head -1)"
          test -n "$deb"
          test "$(sha256sum "$deb" | awk '{print $1}')" = "59f1a57a97963db913cea938a1e4af16728cc0ce67c37c7691c580784bbae6c2"
          test "$(dpkg-deb -f "$deb" Package)" = "com.betterwifirh.tweak"
          test "$(dpkg-deb -f "$deb" Version)" = "0.3.10"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64e"
          sudo apt-get update >/dev/null
          sudo apt-get install -y dpkg-dev >/dev/null
          rm -f debs/com.betterwifirh.tweak_*_iphoneos-arm64e.deb
          cp "$deb" debs/com.betterwifirh.tweak_0.3.10_iphoneos-arm64e.deb
          dpkg-scanpackages -m debs /dev/null > Packages
          gzip -9 -c Packages > Packages.gz
          grep -q '^Package: com.betterwifirh.tweak$' Packages
          grep -q '^Version: 0.3.10$' Packages
          grep -q '^SHA256: 59f1a57a97963db913cea938a1e4af16728cc0ce67c37c7691c580784bbae6c2$' Packages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debs Packages Packages.gz
          git commit -m "Update BetterWiFi RH to 0.3.10"
          git push
