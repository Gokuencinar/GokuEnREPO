name: Build COS Settings 18 (rootless)
on:
  push:
  workflow_dispatch:

jobs:
  rootless:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Theos toolchain
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'theos/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'
      - name: Validate preferences and packaging
        run: python3 COSSettings18/tests/check_project.py
      - name: Compile and package
        run: make -C COSSettings18 clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
      - name: Verify Preferences can load arm64e binaries
        shell: bash
        run: |
          set -euo pipefail
          package=$(find COSSettings18/packages -maxdepth 1 -type f -name 'com.gokuencinar.cossettings18_0.1.1_*.deb' -print -quit)
          test -n "$package"
          dpkg-deb -x "$package" "$RUNNER_TEMP/cossettings18-verify"
          for binary in \
            "$RUNNER_TEMP/cossettings18-verify/var/jb/Library/MobileSubstrate/DynamicLibraries/COSSettings18.dylib" \
            "$RUNNER_TEMP/cossettings18-verify/var/jb/Library/PreferenceBundles/COSSettings18Prefs.bundle/COSSettings18Prefs"; do
            test -f "$binary"
            file "$binary"
            lipo -archs "$binary" | tr ' ' '\n' | grep -Fx arm64e
          done
      - name: Upload experimental package
        uses: actions/upload-artifact@v4
        with:
          name: COSSettings18-rootless
          path: COSSettings18/packages/*.deb
          if-no-files-found: error
