name: Build Better PreferenceLoader experimental
on:
  push:
    paths:
      - 'BetterPreferenceLoader/**'
      - '.github/workflows/build-better-preferenceloader.yml'
  workflow_dispatch:

jobs:
  rootless:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'theos/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'
      - name: Build rootless fork
        run: make -C BetterPreferenceLoader package FINALPACKAGE=1 SCHEME=rootless
      - name: Verify rootless package and Mach-O slices
        shell: bash
        run: |
          set -euo pipefail
          package=$(find BetterPreferenceLoader/packages -maxdepth 1 -type f -name 'preferenceloader_*_iphoneos-arm64.deb' -print -quit)
          test -n "$package"
          mkdir -p "$RUNNER_TEMP/pl-archive" "$RUNNER_TEMP/pl-root"
          cd "$RUNNER_TEMP/pl-archive"
          ar -x "$GITHUB_WORKSPACE/$package"
          data_tar=$(find . -maxdepth 1 -name 'data.tar.*' -print -quit)
          test -n "$data_tar"
          tar -xf "$data_tar" -C "$RUNNER_TEMP/pl-root"
          for binary in \
            "$RUNNER_TEMP/pl-root/var/jb/Library/MobileSubstrate/DynamicLibraries/PreferenceLoader.dylib" \
            "$RUNNER_TEMP/pl-root/var/jb/usr/lib/libprefs.dylib"; do
            test -f "$binary"
            file "$binary"
            lipo -archs "$binary" | tr ' ' '\n' | grep -Fx arm64e
          done
      - uses: actions/upload-artifact@v4
        with:
          name: BetterPreferenceLoader-rootless-experimental
          path: BetterPreferenceLoader/packages/*_iphoneos-arm64.deb
          if-no-files-found: error
