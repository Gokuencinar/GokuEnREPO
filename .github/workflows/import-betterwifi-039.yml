name: Import BetterWiFi RH 0.3.9

on:
  push:
    paths:
      - '.github/workflows/import-betterwifi-039.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify 0.3.9
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_URL="https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-0200-8210-84cb-69dbfbbd52cc/raw?se=2026-09-28T11%3A22%3A33Z&sp=r&sv=2026-02-06&sr=b&scid=715587da-a96c-5a25-8568-62429876bc71&skoid=a63e6f05-dc2f-4fa5-b0e3-b1cb9c0893bb&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T07%3A06%3A49Z&ske=2026-09-29T07%3A06%3A49Z&sks=b&skv=2026-02-06&sig=8xDeIlP6WeRVz/RuS%2B2o2iC6yT9WlKXr%2BhPzdKEYKPc%3D"
          curl -fL "$ARTIFACT_URL" -o /tmp/bwrh039.zip
          unzip -q /tmp/bwrh039.zip -d /tmp/bwrh039
          deb="$(find /tmp/bwrh039 -name '*.deb' -type f | head -1)"
          test -n "$deb"
          test "$(sha256sum "$deb" | awk '{print $1}')" = "d8ac10e37db972e19b6c3e6b52369a1c10f6873f7269a0811c21bfa1d5fc4fde"
          test "$(dpkg-deb -f "$deb" Package)" = "com.betterwifirh.tweak"
          test "$(dpkg-deb -f "$deb" Version)" = "0.3.9"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64e"
          cp "$deb" /tmp/com.betterwifirh.tweak_0.3.9_iphoneos-arm64e.deb

      - name: Publish and rebuild index
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y dpkg-dev >/dev/null
          rm -f debs/com.betterwifirh.tweak_0.3.8_iphoneos-arm64e.deb
          cp /tmp/com.betterwifirh.tweak_0.3.9_iphoneos-arm64e.deb debs/
          rm -f .upload/bwrh039.part*
          rmdir .upload 2>/dev/null || true
          dpkg-scanpackages -m debs /dev/null > Packages
          gzip -9 -c Packages > Packages.gz

          python3 - <<'PY'
          from pathlib import Path
          for path in (Path("README.md"), Path("index.html")):
              if path.exists():
                  text = path.read_text()
                  text = text.replace("BetterWiFi RH 0.3.8", "BetterWiFi RH 0.3.9")
                  text = text.replace("BetterWiFi RH</strong> — 0.3.8", "BetterWiFi RH</strong> — 0.3.9")
                  path.write_text(text)
          PY

          grep -q '^Package: com.gokuencinar.bandlock$' Packages
          grep -q '^Package: com.betterwifirh.tweak$' Packages
          grep -q '^Version: 0.3.9$' Packages
          grep -q '^Architecture: iphoneos-arm64e$' Packages
          grep -q '^SHA256: d8ac10e37db972e19b6c3e6b52369a1c10f6873f7269a0811c21bfa1d5fc4fde$' Packages

      - name: Commit update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update BetterWiFi RH to 0.3.9"
          git push
